nextest-version = "0.9.99"
experimental = ["wrapper-scripts"]

[profile.default]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

[scripts.wrapper.macos-ui]
command = { command-line = "scripts/run-macos-ui-test.sh", relative-to = "workspace-root" }
target-runner = "overrides-wrapper"

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "macos")', target = 'cfg(target_os = "macos")' }
filter = 'package(=chaos-console) | package(=libui)'
list-wrapper = "macos-ui"
run-wrapper = "macos-ui"
