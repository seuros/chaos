nextest-version = "0.9.99"
experimental = ["wrapper-scripts"]

[profile.default]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

[[profile.default.overrides]]
filter = 'package(=chaos-cli) & binary(=durable_httpd)'
# Exercise the real 90-second execution lease instead of rewriting storage time.
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
filter = 'package(=chaos-kern) & (test(client::invocation::tests::native_minions_) | test(client::invocation::tests::review_delegate_) | test(client::invocation::tests::unregistered_descendant_) | test(minions::control::tests::unmetered_historical_parent_))'
# Native startup/cleanup barriers are deliberately exercised, not mocked away.
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "5s" }

[scripts.wrapper.macos-ui]
command = { command-line = "scripts/run-macos-ui-test.sh", relative-to = "workspace-root" }
target-runner = "overrides-wrapper"

[[profile.default.scripts]]
platform = { host = 'cfg(target_os = "macos")', target = 'cfg(target_os = "macos")' }
filter = 'package(=chaos-console) | package(=libui)'
list-wrapper = "macos-ui"
run-wrapper = "macos-ui"
