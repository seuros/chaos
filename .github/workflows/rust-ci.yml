name: rust-ci
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      feature-checks:
        description: Run the expensive CLI feature combination checks
        type: boolean
        default: false

permissions:
  contents: read

# Fail on Linux before spending macOS runner time. SQLite is additive and
# reuses the Linux build; the release workflow still builds all release targets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux — PostgreSQL then SQLite
    uses: ./.github/workflows/rust-test-runner.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      sqlite-checks: true
      feature-checks: ${{ github.event_name == 'workflow_dispatch' && inputs.feature-checks }}

  macos-tests:
    name: macOS — PostgreSQL
    needs: [linux-tests]
    uses: ./.github/workflows/rust-test-runner.yml
    with:
      runner: macos-26
      target: aarch64-apple-darwin
      feature-checks: ${{ github.event_name == 'workflow_dispatch' && inputs.feature-checks }}

  tls-backends:
    name: Isolated MCP TLS backends
    uses: ./.github/workflows/rust-tls.yml

  # Keep the required status name stable, and reject skipped downstream jobs.
  results:
    name: CI results (required)
    needs: [linux-tests, macos-tests, tls-backends]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux-tests.result }}
          MACOS_RESULT: ${{ needs.macos-tests.result }}
          TLS_RESULT: ${{ needs.tls-backends.result }}
        run: |
          echo "Linux PostgreSQL + SQLite: $LINUX_RESULT"
          echo "macOS PostgreSQL: $MACOS_RESULT"
          echo "Isolated TLS backends: $TLS_RESULT"
          [[ "$LINUX_RESULT" == success && "$MACOS_RESULT" == success && "$TLS_RESULT" == success ]]
