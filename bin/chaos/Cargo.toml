[package]
name = "chaos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "chaos"

[[bin]]
name = "chaos"
path = "src/main.rs"

[lib]
name = "chaos_boot"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["tui"]
# Omit the interactive console and renderer from headless/server builds.
tui = ["dep:chaos-console", "dep:owo-colors", "dep:supports-color"]

[dependencies]
alcatraz = { workspace = true }
anyhow = { workspace = true }
chaos-argv = { workspace = true }
chaos-getopt = { workspace = true }
chaos-sysctl = { workspace = true }
toml_edit = { workspace = true }
toml = { workspace = true }
chaos-kern = { workspace = true }
chaos-fork = { workspace = true }
chaos-selinux = { workspace = true }
chaos-pam = { workspace = true }
chaos-mcpd = { workspace = true }
chaos-httpd = { workspace = true }
chaos-taskd = { workspace = true }
chaos-pwd = { workspace = true }
chaos-ipc = { workspace = true }
chaos-console = { workspace = true, optional = true }
chaos-snitch = { workspace = true }
chaos-client = { workspace = true }
rama = { workspace = true }
libc = { workspace = true }
mimalloc = { workspace = true }
owo-colors = { workspace = true, optional = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
supports-color = { workspace = true, optional = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
usage = { workspace = true, features = ["completions"] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
chaos-which = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["sqlx", "chaos-sysctl"]
