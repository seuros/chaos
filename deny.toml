# Chaos cargo-deny configuration
# We are Apache-2.0 FOSS — permissive by default.

[graph]
all-features = false
no-default-features = false
# Chaos targets Linux/macOS/FreeBSD only. Restricting the graph drops every
# cfg(windows)-gated dependency, so windows-sys/windows-targets/winapi stop
# polluting the ban + license + advisory checks.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-freebsd",
    "aarch64-unknown-freebsd",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; pulled via syntect dump-load for pre-compiled grammars" },
]

[licenses]
# FOSS project — accept all OSI-approved and common permissive licenses.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# unicodeit's generated TeX symbol tables carry the upstream LPPL license.
[[licenses.exceptions]]
crate = "unicodeit"
allow = ["LPPL-1.3c"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "axum", reason = "we use rama for HTTP servers — no duplicate web frameworks" },
    { crate = "reqwest", reason = "we use rama for HTTP clients — no duplicate HTTP stacks" },
    # Belt and suspenders on top of [graph].targets: these only survive target
    # filtering if something depends on them *unconditionally*, which is a bug.
    { crate = "winapi", reason = "Chaos does not target Windows; an unconditional winapi dep is a mistake" },
    { crate = "windows-sys", reason = "Chaos does not target Windows; must be cfg(windows)-gated if present at all" },
    { crate = "windows", reason = "Chaos does not target Windows; must be cfg(windows)-gated if present at all" },
]

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
