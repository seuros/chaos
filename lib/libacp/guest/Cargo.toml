[package]
name = "acp-guest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Bounded Tokio ACP client connections using the official Agent Client Protocol SDK"
repository = "https://github.com/seuros/chaos"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md"]

[dependencies]
agent-client-protocol = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
libc = { workspace = true }
mcp-host = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "rt-multi-thread"] }

[lints]
workspace = true
