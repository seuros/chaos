[package]
name = "acp-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Bounded Tokio ACP agent hosting using the official Agent Client Protocol SDK"
repository = "https://github.com/seuros/chaos"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "README.md"]

[dependencies]
agent-client-protocol = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
acp-guest = { path = "../guest" }
tokio = { workspace = true, features = ["io-std", "test-util"] }

[lints]
workspace = true
