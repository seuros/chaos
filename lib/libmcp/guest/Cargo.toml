[package]
name = "mcp-guest"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "MCP client for connecting to Model Context Protocol servers"
repository = "https://github.com/seuros/chaos"
documentation = "https://docs.rs/mcp-guest"
readme = "README.md"
keywords = ["mcp", "client", "ai", "json-rpc"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["stdio"]
stdio = []
http = ["dep:chrono-machines", "dep:rama", "dep:rand", "dep:tokio-stream", "dep:url"]

[dependencies]
chrono-machines = { workspace = true, optional = true }
mcp-host = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util", "process", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
rama = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true
