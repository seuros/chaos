# Third-party model providers bundled with chaos.
#
# Each entry deserializes into `ModelProviderInfo`. The section key becomes
# the provider ID used in `config.toml` (`model_provider = "..."`).
#
# Schema (all fields except `name` are optional):
#
#   [<provider_id>]
#   name                     = "Display Name"
#   model_family             = "Canonical family, or omitted for unknown"
#   base_url                 = "https://api.example.com/v1"
#   env_key                  = "EXAMPLE_API_KEY"
#   env_key_instructions     = "Grab a key at https://example.com/keys"
#   wire_api                 = "auto" | "responses" | "chat_completions" | "tensorzero"
#   query_params             = { foo = "bar" }
#   http_headers             = { "X-Static-Header" = "value" }
#   env_http_headers         = { "X-From-Env" = "ENV_VAR_NAME" }
#   request_max_retries      = 4
#   stream_max_retries       = 5
#   stream_idle_timeout_ms   = 300000
#   requires_openai_auth     = false
#   supports_websockets      = false
#   native_server_side_tools = []
#
# Entries in `~/.chaos/config.toml` under `[model_providers.<id>]` override
# this file.

[charm]
name                 = "Charm Hyper"
base_url             = "https://hyper.charm.land/v1"
env_key              = "CHARM_API_KEY"
env_key_instructions = "Get an API key at https://charm.land and export it as CHARM_API_KEY."
wire_api             = "chat_completions"

[moonshotai]
name                 = "Moonshot AI"
model_family         = "kimi"
base_url             = "https://api.moonshot.ai/v1"
env_key              = "MOONSHOT_API_KEY"
env_key_instructions = "Get an API key at https://platform.kimi.ai/console/api-keys and export it as MOONSHOT_API_KEY."
wire_api             = "responses"
native_server_side_tools = ["web_search"]

[moonshotai-coding]
name                 = "Moonshot AI Coding"
model_family         = "kimi"
base_url             = "https://api.kimi.ai/coding/v1"
env_key              = "KIMI_API_KEY"
env_key_instructions = "Create a Kimi Code API key at https://www.kimi.com/code/console and export it as KIMI_API_KEY. Moonshot API keys do not use this subscription endpoint."
wire_api             = "responses"
native_server_side_tools = ["web_search"]

[xai]
name                 = "xAI"
model_family         = "xai"
base_url             = "https://api.x.ai/v1"
env_key              = "XAI_API_KEY"
env_key_instructions = "Get an API key at https://console.x.ai and export it as XAI_API_KEY."
wire_api             = "responses"
auth.methods         = ["api_key", "xai_account"]

[zai]
name                 = "Z.ai"
base_url             = "https://api.z.ai/api/paas/v4"
env_key              = "ZAI_API_KEY"
env_key_instructions = "Get an API key at https://z.ai and export it as ZAI_API_KEY."
wire_api             = "chat_completions"

[zai-coding]
name                 = "Z.ai Coding Plan"
base_url             = "https://api.z.ai/api/coding/paas/v4"
env_key              = "ZAI_API_KEY"
env_key_instructions = "Subscribe to the GLM Coding Plan at https://z.ai and export your key as ZAI_API_KEY."
wire_api             = "chat_completions"
