[package]
name = "chaos-httpd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["mcpd"]
# Keep ordinary HTTP triggers/sessions without the embedded MCP server.
mcpd = ["dep:chaos-mcpd", "dep:mcp-host"]

[dependencies]
chaos-session = { workspace = true }
anyhow = { workspace = true }
chaos-argv = { workspace = true }
chaos-coreboot = { workspace = true }
chaos-getopt = { workspace = true }
chaos-ipc = { workspace = true }
chaos_journald = { workspace = true }
chaos-kern = { workspace = true }
chaos-mcpd = { workspace = true, optional = true }
mcp-host = { workspace = true, features = ["http"], optional = true }
rama = { workspace = true }
chaos-snitch = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
usage = { workspace = true }

[dev-dependencies]
chaos-proc = { workspace = true }
sqlx = { workspace = true }
chaos-test-fixtures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
