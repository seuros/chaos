{% import "partials/icons.html" as icons %}
<section id="w-map" class="widget map" style="--breath: {{ map.breath }}">
  <header class="widget-head">
    <h2 class="widget-title">Topology</h2>
    <span class="widget-meta">{{ map.nodes | length }} stations · {{ map.core.working }} active</span>
  </header>
  <svg class="map-svg" viewBox="0 0 {{ map.width }} {{ map.height }}" role="img" aria-label="Where the resident's tool calls are running">
    <defs>
      <filter id="map-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <g class="map-rings">
      {% for ring in map.rings %}<ellipse class="{{ 'ticks' if loop.last else 'contour' }}" cx="{{ map.core.x }}" cy="{{ map.core.y }}" rx="{{ ring[0] }}" ry="{{ ring[1] }}"/>{% endfor %}
    </g>
    {% for node in map.nodes %}
    <path class="spoke" data-active="{{ (node.active > 0) | flag }}" d="{{ node.spoke }}"/>
    {% endfor %}
    {% for leg in map.legs %}
    <path class="leg{% if leg.newest %} is-newest{% endif %}" d="{{ leg.path }}" style="opacity: {{ leg.opacity }}"/>
    {% endfor %}
    {% for packet in map.packets %}
    <g class="packet" data-hue="{{ packet.hue }}">
      {% for spark in packet.trail %}
      <circle r="{{ spark.r }}" style="opacity: {{ spark.opacity }}">
        <animateMotion dur="{{ packet.dur }}s" begin="{{ spark.begin }}" repeatCount="indefinite" path="{{ packet.path }}"/>
      </circle>
      {% endfor %}
    </g>
    {% endfor %}
    <g class="core" data-working="{{ (map.core.working > 0) | flag }}">
      <circle class="core-halo" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ map.core.r + 14 }}" filter="url(#map-glow)"/>
      {% if map.core.shock %}<circle class="shock" data-tone="{{ map.core.shock.tone }}" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ map.core.r }}" style="animation-delay: {{ map.core.shock.delay }}"/>{% endif %}
      <circle class="core-ring" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ map.core.ring_r }}"/>
      {% if map.core.context %}<circle class="core-context" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ map.core.ring_r }}" stroke-dasharray="{{ map.core.ring_fill }}" transform="rotate(-90 {{ map.core.x }} {{ map.core.y }})"/>{% endif %}
      <circle class="core-body" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ map.core.r }}"/>
      <text class="core-meta" x="{{ map.core.x }}" y="{{ map.core.y - 22 }}">{% if map.core.context is not none %}{{ map.core.context }}%{% else %}·{% endif %}</text>
      <text class="core-name" x="{{ map.core.x }}" y="{{ map.core.y + 5 }}">CHAOS</text>
      <text class="core-model" x="{{ map.core.x }}" y="{{ map.core.y + 24 }}">{{ map.core.model or "idle" }}</text>
    </g>
    {% for orbit in map.orbits %}
    <g class="orbit" data-hue="{{ orbit.hue }}" style="transform-origin: {{ map.core.x }}px {{ map.core.y }}px; animation-delay: {{ orbit.delay }}">
      <circle class="orbit-path" cx="{{ map.core.x }}" cy="{{ map.core.y }}" r="{{ orbit.radius }}"/>
      <circle class="orbit-body" cx="{{ map.core.x + orbit.radius }}" cy="{{ map.core.y }}" r="5"><title>{{ orbit.name }}</title></circle>
    </g>
    {% endfor %}
    {% for node in map.nodes %}
    <g class="node{% if node.glitch %} is-glitching{% endif %}" data-station="{{ node.station }}" data-active="{{ (node.active > 0) | flag }}"{% if node.glitch %} style="--glitch: {{ node.glitch.delay }}"{% endif %}>
      <circle class="node-halo" cx="{{ node.x }}" cy="{{ node.y }}" r="{{ node.r + 10 }}" filter="url(#map-glow)"/>
      <circle class="node-outer" cx="{{ node.x }}" cy="{{ node.y }}" r="{{ node.r + 5 }}"/>
      <circle class="node-body" cx="{{ node.x }}" cy="{{ node.y }}" r="{{ node.r }}"/>
      {{ icons.station(node.station, node.x, node.y) }}
      {% if node.active > 1 %}<g class="node-badge"><circle cx="{{ node.x + node.r * 0.78 }}" cy="{{ node.y - node.r * 0.78 }}" r="10"/><text x="{{ node.x + node.r * 0.78 }}" y="{{ node.y - node.r * 0.78 + 3.5 }}">×{{ node.active }}</text></g>{% endif %}
      <text class="node-label" x="{{ node.x }}" y="{{ node.label_y }}">{{ node.station }}</text>
      <text class="node-tally" x="{{ node.x }}" y="{{ node.label_y + 15 }}">{{ node.done }}{% if node.failed %} <tspan class="node-failed">{{ node.failed }}✕</tspan>{% endif %}</text>
      {% for pip in node.pips %}<circle class="pip" data-hue="{{ pip.hue }}" cx="{{ pip.x }}" cy="{{ pip.y }}" r="3"/>{% endfor %}
    </g>
    {% endfor %}
  </svg>
  <p class="route"><span class="route-label">route</span>{% for stop in map.route %}<span class="route-stop">{{ stop }}</span>{% if not loop.last %}<span class="route-arrow">→</span>{% endif %}{% else %}<span class="route-stop is-empty">no calls yet</span>{% endfor %}</p>
</section>
