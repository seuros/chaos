[package]
name = "chaos-clamp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party model CLI subprocess transports for subscription-backed inference"

[lints]
workspace = true

[dependencies]
alcatraz = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chaos-abi = { workspace = true }
chaos-client = { workspace = true }
chaos-ipc = { workspace = true }
chaos-pf = { workspace = true }
chaos-realpath = { workspace = true }
futures = { workspace = true }
mcp-host = { workspace = true }
rama = { workspace = true }
chaos-snitch = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
which = { workspace = true }

[dev-dependencies]
acp-guest = { path = "../../../lib/libacp/guest", version = "0.1.0" }
libc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true, features = ["codec"] }

[package.metadata.cargo-shear]
ignored = ["chaos-abi", "chaos-ipc"]
